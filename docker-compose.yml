  # 15. Review and Rating Service
  review-service:
    build: .
    container_name: timebank-review-service
    command: ["npx", "tsx", "server/microservices/reviews/server.ts"]
    ports:
      - "5014:5014"
    environment:
      - REVIEW_SERVICE_PORT=5014
      - STANDALONE=true
    volumes:
      - timebank-data:/app/server/data
    networks:
