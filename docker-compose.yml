    networks:
      - timebank-net
    restart: unless-stopped

  # 11. Email Notification Service
  email-service:
    build: .
    container_name: timebank-email-service
    command: ["npx", "tsx", "server/microservices/email/server.ts"]
    ports:
      - "5010:5010"
    environment:
