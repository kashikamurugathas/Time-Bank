      - STANDALONE=true
    volumes:
      - timebank-data:/app/server/data
    networks:
      - timebank-net
    restart: unless-stopped

  # 12. Subscription Service
  subscription-service:
    build: .
    container_name: timebank-subscription-service
    command: ["npx", "tsx", "server/microservices/subscriptions/server.ts"]
    ports:
      - "5011:5011"
    environment:
      - SUBSCRIPTION_SERVICE_PORT=5011
